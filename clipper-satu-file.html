<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10121A">
<title>Clipper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Clipper — mobile-first, dark mode */
:root{
  --bg:#10121A; --surface:#191C27; --surface-2:#232838; --line:#2D3348;
  --text:#EEF0F6; --muted:#9AA1B5;
  --accent:#FFB43B; --accent-ink:#1B1203;   /* amber: warna penanda in/out di timeline */
  --audio:#5CD6C0; --danger:#FF7070;
  --nav-h:60px; --bar-h:72px; --r:14px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);
  font:500 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.chip{font-size:12px;color:var(--muted);background:var(--surface);padding:6px 10px;border-radius:99px}

/* Layout */
main{max-width:640px;margin:0 auto;padding:8px 16px calc(var(--nav-h) + var(--bar-h) + 24px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
.section-title{font-size:18px;font-weight:800;margin:28px 0 4px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 12px}
.error{color:var(--danger);font-size:13px;margin-top:8px}
.field-label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.empty{text-align:center;padding:64px 0;color:var(--muted);display:grid;gap:16px;justify-items:center}

/* Input & buttons */
input[type=url],input[type=text]{
  width:100%;min-height:52px;padding:0 14px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);
}
input::placeholder{color:#697089}
.url-row{display:flex;gap:8px;margin-bottom:10px}
.btn{
  min-height:52px;padding:0 18px;border-radius:var(--r);font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s, background .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn.block{width:100%;margin-top:10px}
.btn.small{min-height:44px;margin-top:8px;font-size:14px}
.btn.round{width:52px;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex:none}
.btn[disabled]{opacity:.6;pointer-events:none}
.file-btn{cursor:pointer;text-align:center}

/* Kartu & grid */
.card{background:var(--surface);border-radius:var(--r);padding:10px;margin:14px 0}
.embed{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.embed iframe{width:100%;height:100%;border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left}
.tile .thumb{position:relative;aspect-ratio:16/9;background:#000 center/cover}
.tile .badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);padding:2px 7px;border-radius:6px;font-size:12px;font-weight:700}
.tile .meta{padding:10px 10px 4px;font-size:13px;line-height:1.3;flex:1}
.tile .meta small{display:block;color:var(--muted);margin-top:2px}
.tile .edit{margin:6px 10px 10px;min-height:44px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:13px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}

/* Stage / canvas */
.stage-wrap{display:flex;justify-content:center;margin:4px 0 14px}
.stage{
  position:relative;overflow:hidden;background:#000;border-radius:var(--r);
  container-type:inline-size;transition:aspect-ratio .25s,width .25s;
}
.stage.r169{aspect-ratio:16/9;width:100%}
.stage.r916{aspect-ratio:9/16;width:min(64%,300px)}
#media{position:absolute;inset:0}
#media iframe,#media video{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#media video{object-fit:contain}
.r916 #media video{object-fit:cover;object-position:var(--cx) 50%}
.r916 #media iframe{          /* crop 16:9 → 9:16 */
  inset:auto;top:0;height:100%;width:auto;aspect-ratio:16/9;
  left:var(--cx);transform:translateX(calc(var(--cx) * -1));
}
.subtitle{
  position:absolute;left:6%;right:6%;text-align:center;font-weight:800;line-height:1.25;
  color:#fff;font-size:calc(var(--sub,5) * 1cqw);
  text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 2px #000;pointer-events:none;
}
.subtitle.pos-top{top:7%}
.subtitle.pos-mid{top:50%;transform:translateY(-50%)}
.subtitle.pos-bottom{bottom:7%}

/* Transport */
.transport{display:flex;align-items:center;gap:10px}
.time{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#btnRatio b{color:var(--accent)}

/* Tabs & panel */
.tabs{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:var(--r);margin:16px 0 12px}
.tabs button{flex:1;min-height:46px;border-radius:10px;color:var(--muted);font-weight:700}
.tabs button.on{background:var(--surface-2);color:var(--text)}
.panel{display:none;background:var(--surface);border-radius:var(--r);padding:14px}
.panel.on{display:block}
.slider-row{display:flex;justify-content:space-between;margin:14px 0 2px;font-size:14px}
.slider-row:first-child{margin-top:0}
output{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
#panel-audio output{color:var(--audio)}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;min-height:46px;border-radius:10px;background:var(--surface-2);font-weight:700}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* Range: area sentuh besar */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:var(--surface-2)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:var(--surface-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
#panel-audio input[type=range]::-webkit-slider-thumb{background:var(--audio)}
#panel-audio input[type=range]::-moz-range-thumb{background:var(--audio)}

/* Export bar & nav */
.export-bar{
  position:fixed;left:0;right:0;z-index:6;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding:10px 16px;background:linear-gradient(transparent,var(--bg) 35%);
}
.export-bar .btn{max-width:640px;margin:0 auto;display:flex;position:relative;overflow:hidden;
  background:linear-gradient(90deg,#FFD07A var(--p,0%),var(--accent) var(--p,0%))}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--line);
}
.bottom-nav button{flex:1;color:var(--muted);font-weight:700}
.bottom-nav button.on{color:var(--accent)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--bar-h) + 20px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:9;
  background:var(--surface-2);border:1px solid var(--line);padding:12px 16px;border-radius:12px;
  max-width:90%;font-size:14px;transition:.2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>

<header class="top">
  <h1>Clipper</h1>
  <span id="statusChip" class="chip">Belum ada video</span>
</header>

<main>
  <!-- ========== IMPOR ========== -->
  <section id="view-import" class="view on">
    <label class="field-label" for="ytUrl">Link YouTube</label>
    <div class="url-row">
      <input id="ytUrl" type="url" inputmode="url" placeholder="Tempel link video atau live" autocomplete="off">
      <button id="btnPaste" class="btn ghost" type="button">Tempel</button>
    </div>
    <button id="btnLoad" class="btn primary block" type="button">Muat video</button>
    <p id="urlError" class="error" hidden></p>

    <div id="previewCard" class="card" hidden>
      <div class="embed"><iframe id="previewFrame" title="Pratinjau video" allowfullscreen
        allow="encrypted-media; picture-in-picture"></iframe></div>
      <button id="btnEdit" class="btn primary block" type="button">Edit jadi klip</button>
    </div>

    <label class="btn ghost block file-btn">
      Atau pilih video dari HP
      <input id="videoFile" type="file" accept="video/*" hidden>
    </label>

    <h2 class="section-title">Momen viral</h2>
    <p class="hint">Contoh data. Isi API key di app.js untuk memuat video trending asli.</p>
    <div id="trendGrid" class="grid"></div>
  </section>

  <!-- ========== EDITOR ========== -->
  <section id="view-editor" class="view">
    <div id="emptyEditor" class="empty">
      <p>Belum ada video untuk diedit.</p>
      <button class="btn primary" data-go="import" type="button">Pilih video</button>
    </div>

    <div id="editorBody" hidden>
      <div class="stage-wrap">
        <div id="stage" class="stage r169" style="--cx:50%">
          <div id="media"></div>
          <div id="subtitle" class="subtitle pos-bottom"></div>
        </div>
      </div>

      <div class="transport">
        <button id="btnPlay" class="btn round" type="button" aria-label="Putar">▶</button>
        <div class="time"><span id="timeNow">0:00</span><div class="bar"><i id="playFill"></i></div></div>
        <button id="btnRatio" class="btn ghost" type="button">Ubah Rasio <b id="ratioLabel">16:9</b></button>
      </div>

      <div class="tabs" role="tablist">
        <button class="on" data-tab="trim" role="tab">Potong</button>
        <button data-tab="sub" role="tab">Subtitle</button>
        <button data-tab="audio" role="tab">Audio</button>
      </div>

      <div id="panel-trim" class="panel on">
        <div class="slider-row"><label for="rngStart">Mulai</label><output id="outStart">0:00</output></div>
        <input id="rngStart" type="range" min="0" max="60" step="0.1" value="0">
        <button id="setStart" class="btn ghost small" type="button">Mulai dari posisi sekarang</button>

        <div class="slider-row"><label for="rngEnd">Selesai</label><output id="outEnd">0:30</output></div>
        <input id="rngEnd" type="range" min="0" max="60" step="0.1" value="30">
        <button id="setEnd" class="btn ghost small" type="button">Selesai di posisi sekarang</button>

        <p class="hint">Durasi klip: <b id="clipLen">0:30</b></p>

        <div id="cropRow" hidden>
          <div class="slider-row"><label for="rngCrop">Geser area crop 9:16</label></div>
          <input id="rngCrop" type="range" min="0" max="100" value="50">
        </div>
      </div>

      <div id="panel-sub" class="panel">
        <label class="field-label" for="subText">Teks subtitle</label>
        <input id="subText" type="text" maxlength="120" placeholder="Ketik teks yang tampil di video">
        <div class="seg" id="subPos">
          <button data-pos="top">Atas</button>
          <button data-pos="mid">Tengah</button>
          <button class="on" data-pos="bottom">Bawah</button>
        </div>
        <div class="slider-row"><label for="subSize">Ukuran teks</label></div>
        <input id="subSize" type="range" min="3" max="9" step="0.5" value="5">
      </div>

      <div id="panel-audio" class="panel">
        <label class="btn ghost block file-btn">
          <span id="bgmName">Unggah backsound dari HP</span>
          <input id="bgmFile" type="file" accept="audio/*" hidden>
        </label>
        <div class="slider-row"><label for="volOrig">Suara asli video</label><output id="outVolOrig">100%</output></div>
        <input id="volOrig" type="range" min="0" max="100" value="100">
        <div class="slider-row"><label for="volBgm">Backsound</label><output id="outVolBgm">60%</output></div>
        <input id="volBgm" type="range" min="0" max="100" value="60">
        <button id="bgmClear" class="btn ghost small" type="button" hidden>Hapus backsound</button>
      </div>
    </div>
  </section>
</main>

<div id="exportBar" class="export-bar" hidden>
  <button id="btnExport" class="btn primary block" type="button"><span id="exportLabel">Unduh ke Galeri</span></button>
</div>

<nav class="bottom-nav">
  <button class="on" data-go="import" type="button">Impor</button>
  <button data-go="editor" type="button">Editor</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   Clipper — logika UI
   ========================================================= */
const SIMULATE_RENDER = true;   // false → pakai renderWithFFmpeg() (lihat bagian bawah)
const YT_API_KEY = '';          // isi dengan YouTube Data API v3 key untuk trending asli

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { s = Math.max(0, s || 0); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };

/* ---------- State ---------- */
const S = {
  src: null,            // {type:'yt', id, start} | {type:'file', file}
  dur: 0, start: 0, end: 30,
  ratio: '16:9', cx: 50,
  sub: { text: '', pos: 'bottom', size: 5 },
  bgm: null,            // {file, audio}
  volOrig: 100, volBgm: 60,
  playing: false, rendering: false,
};
let P = null, tickId = null;     // P = adapter pemutar aktif

/* ---------- Toast & navigasi ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}
function go(view) {
  $$('.view').forEach(v => v.classList.toggle('on', v.id === `view-${view}`));
  $$('.bottom-nav button').forEach(b => b.classList.toggle('on', b.dataset.go === view));
  $('#exportBar').hidden = !(view === 'editor' && S.src);
  window.scrollTo({ top: 0 });
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

/* ---------- Impor link YouTube ---------- */
function parseYT(raw) {
  try {
    raw = raw.trim(); if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
    const u = new URL(raw); let id = null;
    if (u.hostname.includes('youtu.be')) id = u.pathname.slice(1, 12);
    else if (u.hostname.includes('youtube.com'))
      id = u.searchParams.get('v') || (u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/) || [])[1];
    if (!/^[\w-]{11}$/.test(id || '')) return null;
    return { id, start: parseInt(u.searchParams.get('t') || u.searchParams.get('start') || '0', 10) || 0 };
  } catch { return null; }
}
let pending = null;
function showPreview(id, start = 0) {
  pending = { type: 'yt', id, start };
  $('#previewFrame').src = `https://www.youtube.com/embed/${id}?start=${start}&playsinline=1&rel=0`;
  $('#previewCard').hidden = false;
  $('#previewCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('#btnLoad').onclick = () => {
  const r = parseYT($('#ytUrl').value), err = $('#urlError');
  err.hidden = !!r;
  if (!r) { err.textContent = 'Link tidak dikenali. Tempel link video YouTube lengkap.'; return; }
  showPreview(r.id, r.start);
};
$('#btnPaste').onclick = async () => {
  try { $('#ytUrl').value = await navigator.clipboard.readText(); $('#btnLoad').click(); }
  catch { toast('Izin clipboard ditolak. Tempel manual di kolom.'); }
};
$('#btnEdit').onclick = () => openEditor(pending);
$('#videoFile').onchange = e => { const f = e.target.files[0]; if (f) openEditor({ type: 'file', file: f }); };

/* ---------- Rekomendasi momen viral ---------- */
const SAMPLE = [  // data contoh — ganti dengan hasil fetchTrending()
  { id: 'dQw4w9WgXcQ', title: 'Momen contoh 1', channel: 'Data contoh', start: 43 },
  { id: '9bZkp7q19f0', title: 'Momen contoh 2', channel: 'Data contoh', start: 61 },
  { id: 'kJQP7kiw5Fk', title: 'Momen contoh 3', channel: 'Data contoh', start: 25 },
  { id: 'fJ9rUzIMcZQ', title: 'Momen contoh 4', channel: 'Data contoh', start: 120 },
  { id: 'JGwWNGJdvx8', title: 'Momen contoh 5', channel: 'Data contoh', start: 52 },
  { id: 'OPf0YbXqDm0', title: 'Momen contoh 6', channel: 'Data contoh', start: 30 },
];
async function fetchTrending() {
  if (!YT_API_KEY) return SAMPLE;
  try {
    const q = new URLSearchParams({ part: 'snippet', chart: 'mostPopular', regionCode: 'ID', maxResults: 12, key: YT_API_KEY });
    const j = await (await fetch('https://www.googleapis.com/youtube/v3/videos?' + q)).json();
    return j.items.map(v => ({ id: v.id, title: v.snippet.title, channel: v.snippet.channelTitle, start: 0 }));
  } catch { return SAMPLE; }
}
async function renderTrending() {
  const grid = $('#trendGrid');
  grid.replaceChildren(...(await fetchTrending()).map(v => {
    const el = document.createElement('div'); el.className = 'tile';
    el.innerHTML = `<button class="thumb" aria-label="Pratinjau"><span class="badge">${v.start ? 'mulai ' + fmt(v.start) : 'trending'}</span></button>
      <div class="meta"></div><button class="edit">Edit</button>`;
    $('.thumb', el).style.backgroundImage = `url(https://i.ytimg.com/vi/${v.id}/hqdefault.jpg)`;
    $('.meta', el).innerHTML = '<b></b><small></small>';
    $('b', el).textContent = v.title; $('small', el).textContent = v.channel;
    $('.thumb', el).onclick = () => { $('#ytUrl').value = `https://youtu.be/${v.id}`; showPreview(v.id, v.start); };
    $('.edit', el).onclick = () => openEditor({ type: 'yt', id: v.id, start: v.start });
    return el;
  }));
}

/* ---------- Pemutar (adapter YouTube & file lokal) ---------- */
const ytApi = new Promise(res => {
  window.onYouTubeIframeAPIReady = res;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.append(s);
});
async function mountYouTube(id) {
  await ytApi;
  $('#media').innerHTML = '<div id="ytHost"></div>';
  return new Promise(res => {
    const yt = new YT.Player('ytHost', {
      videoId: id, playerVars: { controls: 0, playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, fs: 0 },
      events: {
        onReady: () => res({
          play: () => yt.playVideo(), pause: () => yt.pauseVideo(), seek: t => yt.seekTo(t, true),
          time: () => yt.getCurrentTime(), duration: () => yt.getDuration(),
          volume: v => yt.setVolume(v), destroy: () => yt.destroy(),
        }),
        onStateChange: e => setPlaying(e.data === 1),
      },
    });
  });
}
function mountFile(file) {
  const url = URL.createObjectURL(file), v = document.createElement('video');
  v.src = url; v.playsInline = true; $('#media').replaceChildren(v);
  v.onplay = () => setPlaying(true); v.onpause = () => setPlaying(false);
  return new Promise((res, rej) => {
    v.onerror = () => rej(new Error('Video tidak bisa dibuka'));
    v.onloadedmetadata = () => res({
      play: () => v.play(), pause: () => v.pause(), seek: t => { v.currentTime = t; },
      time: () => v.currentTime, duration: () => v.duration,
      volume: x => { v.volume = x / 100; }, destroy: () => URL.revokeObjectURL(url),
    });
  });
}

/* ---------- Editor ---------- */
async function openEditor(src) {
  if (!src) return;
  $('#btnEdit').disabled = true; toast('Menyiapkan editor…');
  try {
    if (P) { clearInterval(tickId); P.pause(); P.destroy(); P = null; }
    P = src.type === 'yt' ? await mountYouTube(src.id) : await mountFile(src.file);
    let d = 0; for (let i = 0; i < 25 && !(d = P.duration()); i++) await sleep(200);   // tunggu durasi
    S.src = src; S.dur = Math.floor(d) || 60;
    S.start = Math.min(src.start || 0, Math.max(0, S.dur - 1));
    S.end = Math.min(S.dur, S.start + 30);
    ['rngStart', 'rngEnd'].forEach(id => { $('#' + id).max = S.dur; });
    $('#statusChip').textContent = src.type === 'yt' ? 'YouTube' : 'File HP';
    $('#emptyEditor').hidden = true; $('#editorBody').hidden = false;
    syncTrim(); P.seek(S.start); applyVolumes();
    tickId = setInterval(tick, 200);
    go('editor');
  } catch (e) { toast(e.message || 'Gagal memuat video'); }
  $('#btnEdit').disabled = false;
}
function setPlaying(p) {
  S.playing = p; $('#btnPlay').textContent = p ? '❚❚' : '▶';
  const a = S.bgm?.audio; if (!a) return;
  if (p) { a.currentTime = (P.time() - S.start) % (a.duration || 1e9) || 0; a.play().catch(() => {}); } else a.pause();
}
function tick() {
  if (!P) return;
  const t = P.time();
  if (S.playing && t >= S.end) { P.seek(S.start); if (S.bgm) S.bgm.audio.currentTime = 0; }
  const len = S.end - S.start, pos = Math.min(Math.max(t - S.start, 0), len);
  $('#timeNow').textContent = `${fmt(pos)} / ${fmt(len)}`;
  $('#playFill').style.width = (len ? pos / len * 100 : 0) + '%';
}
$('#btnPlay').onclick = () => {
  if (S.playing) return P.pause();
  const t = P.time(); if (t < S.start || t >= S.end - 0.2) P.seek(S.start);
  P.play();
};
$('#stage').onclick = () => $('#btnPlay').click();

/* Trim */
function syncTrim() {
  $('#rngStart').value = S.start; $('#rngEnd').value = S.end;
  $('#outStart').textContent = fmt(S.start); $('#outEnd').textContent = fmt(S.end);
  $('#clipLen').textContent = fmt(S.end - S.start);
}
$('#rngStart').oninput = e => { S.start = Math.min(+e.target.value, S.end - 1); syncTrim(); P.seek(S.start); };
$('#rngEnd').oninput = e => { S.end = Math.max(+e.target.value, S.start + 1); syncTrim(); P.seek(Math.max(S.start, S.end - 1)); };
$('#setStart').onclick = () => { S.start = Math.min(P.time(), S.end - 1); syncTrim(); };
$('#setEnd').onclick = () => { S.end = Math.min(Math.max(P.time(), S.start + 1), S.dur); syncTrim(); };

/* Ubah rasio 16:9 ⇄ 9:16 */
$('#btnRatio').onclick = () => {
  S.ratio = S.ratio === '16:9' ? '9:16' : '16:9';
  const st = $('#stage'); st.classList.toggle('r169', S.ratio === '16:9'); st.classList.toggle('r916', S.ratio === '9:16');
  $('#ratioLabel').textContent = S.ratio; $('#cropRow').hidden = S.ratio === '16:9';
};
$('#rngCrop').oninput = e => { S.cx = +e.target.value; $('#stage').style.setProperty('--cx', S.cx + '%'); };

/* Tab alat */
$$('.tabs button').forEach(b => b.onclick = () => {
  $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $$('.panel').forEach(p => p.classList.toggle('on', p.id === `panel-${b.dataset.tab}`));
});

/* Subtitle */
$('#subText').oninput = e => { S.sub.text = e.target.value; $('#subtitle').textContent = S.sub.text; };
$('#subPos').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.sub.pos = b.dataset.pos; $$('#subPos button').forEach(x => x.classList.toggle('on', x === b));
  $('#subtitle').className = 'subtitle pos-' + S.sub.pos;
};
$('#subSize').oninput = e => { S.sub.size = +e.target.value; $('#stage').style.setProperty('--sub', S.sub.size); };

/* Backsound */
function applyVolumes() {
  P?.volume(S.volOrig);
  if (S.bgm) S.bgm.audio.volume = S.volBgm / 100;
}
$('#bgmFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (S.bgm) { S.bgm.audio.pause(); URL.revokeObjectURL(S.bgm.audio.src); }
  const audio = new Audio(URL.createObjectURL(f)); audio.loop = true;
  S.bgm = { file: f, audio }; applyVolumes();
  $('#bgmName').textContent = f.name; $('#bgmClear').hidden = false;
  if (S.playing) setPlaying(true);
};
$('#bgmClear').onclick = () => {
  S.bgm?.audio.pause(); S.bgm = null; $('#bgmFile').value = '';
  $('#bgmName').textContent = 'Unggah backsound dari HP'; $('#bgmClear').hidden = true;
};
$('#volOrig').oninput = e => { S.volOrig = +e.target.value; $('#outVolOrig').textContent = S.volOrig + '%'; applyVolumes(); };
$('#volBgm').oninput  = e => { S.volBgm  = +e.target.value; $('#outVolBgm').textContent  = S.volBgm  + '%'; applyVolumes(); };

/* =========================================================
   Export — FFmpeg.wasm (simulasi)
   ========================================================= */
function buildFfmpegArgs(j) {
  const dur = j.end - j.start, vf = [];
  vf.push(j.ratio === '9:16'
    ? `crop=ih*9/16:ih:(iw-ih*9/16)*${(j.cx / 100).toFixed(2)}:0,scale=1080:1920`
    : 'scale=1920:1080');
  if (j.text) {
    const y = { top: 'h*0.07', mid: '(h-th)/2', bottom: 'h*0.93-th' }[j.pos];
    vf.push(`drawtext=fontfile=/font.ttf:text='${j.text.replace(/[':\\]/g, '\\$&')}':fontcolor=white:borderw=3:fontsize=w*${j.size / 100}:x=(w-tw)/2:y=${y}`);
  }
  const a = ['-ss', String(j.start), '-i', 'input.mp4'];
  if (j.bgm) {
    a.push('-stream_loop', '-1', '-i', 'bgm.mp3', '-filter_complex',
      `[0:v]${vf.join(',')}[v];[0:a]volume=${j.volOrig / 100}[a0];[1:a]volume=${j.volBgm / 100}[a1];[a0][a1]amix=inputs=2:duration=first[a]`,
      '-map', '[v]', '-map', '[a]');
  } else a.push('-vf', vf.join(','), '-af', `volume=${j.volOrig / 100}`);
  return [...a, '-t', String(dur), '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p', '-c:a', 'aac', 'out.mp4'];
}
async function simulateFFmpeg(args, onStep) {
  const steps = [['Menyiapkan FFmpeg.wasm', 12], ['Memotong durasi', 35], ['Mengubah rasio', 55],
                 ['Menempel subtitle', 72], ['Mencampur audio', 88], ['Menyusun MP4', 100]];
  for (const [label, pct] of steps) { onStep(label, pct); await sleep(550); }
  return new Blob([`SIMULASI — perintah yang akan dijalankan:\nffmpeg ${args.join(' ')}\n`], { type: 'text/plain' });
}
/* Render sungguhan (hanya untuk video dari file HP; YouTube tidak bisa diproses di browser):
async function renderWithFFmpeg(job, args, onStep) {
  const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
  const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
  const ff = new FFmpeg(); ff.on('progress', ({ progress }) => onStep('Merender', Math.round(progress * 100)));
  await ff.load({ coreURL: '…/ffmpeg-core.js', wasmURL: '…/ffmpeg-core.wasm' });
  await ff.writeFile('input.mp4', await fetchFile(job.src.file));
  if (job.bgm) await ff.writeFile('bgm.mp3', await fetchFile(job.bgm.file));
  await ff.writeFile('font.ttf', await fetchFile('/font.ttf'));      // wajib untuk drawtext
  await ff.exec(args);
  return new Blob([await ff.readFile('out.mp4')], { type: 'video/mp4' });
}
*/

async function saveBlob(blob, name) {
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [f] })) {            // HP: lembar bagikan → "Simpan Video"
    try { await navigator.share({ files: [f] }); return 'share'; }
    catch (e) { if (e.name === 'AbortError') return 'cancel'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); return 'download';
}
$('#btnExport').onclick = async () => {
  if (S.rendering || !S.src) return;
  S.rendering = true; P.pause();
  const btn = $('#btnExport'), label = $('#exportLabel');
  btn.disabled = true;
  const onStep = (t, p) => { label.textContent = `${t}… ${p}%`; btn.style.setProperty('--p', p + '%'); };
  const job = { src: S.src, start: S.start, end: S.end, ratio: S.ratio, cx: S.cx, text: S.sub.text,
                pos: S.sub.pos, size: S.sub.size, bgm: S.bgm, volOrig: S.volOrig, volBgm: S.volBgm };
  const args = buildFfmpegArgs(job);
  try {
    const blob = SIMULATE_RENDER
      ? await simulateFFmpeg(args, onStep)
      : await renderWithFFmpeg(job, args, onStep);
    const base = `clip-${S.src.id || 'video'}-${Math.floor(S.start)}s`;
    const r = await saveBlob(blob, SIMULATE_RENDER ? base + '-simulasi.txt' : base + '.mp4');
    if (r !== 'cancel') toast(SIMULATE_RENDER ? 'Simulasi selesai. Perintah FFmpeg tersimpan.' : 'Klip tersimpan.');
  } catch (e) { toast('Render gagal: ' + (e.message || e)); }
  label.textContent = 'Unduh ke Galeri'; btn.style.setProperty('--p', '0%');
  btn.disabled = false; S.rendering = false;
};

/* ---------- Init ---------- */
renderTrending();

</script>
